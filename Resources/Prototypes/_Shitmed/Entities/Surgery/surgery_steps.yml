- type: entity
  id: ShitmedSurgeryStepBase
  categories: [ HideSpawnMenu ]
  components:
  - type: ShitmedSurgeryStep
  - type: ShitmedSurgeryStepDirtiness # DeltaV - surgery cross contamination

- type: entity
  parent: ShitmedSurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Cut with a scalpel
  categories: [ HideSpawnMenu ]
  components:
  - type: ShitmedSurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: IncisionOpen
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        #Bloodloss: 10 # DeltaV
        Slash: 10 # Funky - was 12
    sleepModifier: 0.5
  - type: ShitmedSurgeryStepEmoteEffect

- type: entity
  parent: ShitmedSurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Clamp the bleeders
  categories: [ HideSpawnMenu ]
