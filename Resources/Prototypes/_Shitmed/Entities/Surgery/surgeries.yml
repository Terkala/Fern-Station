- type: entity
  id: ShitmedSurgeryBase
  categories: [ HideSpawnMenu ]

- type: entity
  parent: ShitmedSurgeryBase
  id: ShitmedSurgeryOpenIncision
  name: Open Incision
  categories: [ HideSpawnMenu ]
  components:
  - type: ShitmedSurgery
    steps:
    - SurgeryStepOpenIncisionScalpel
    - SurgeryStepRetractSkin
    - SurgeryStepClampBleeders
  - type: ShitmedSurgeryPartPresentCondition

- type: entity
  parent: ShitmedSurgeryBase
  id: ShitmedSurgeryCloseIncision
  name: Close Incision
  categories: [ HideSpawnMenu ]
  components:
  - type: ShitmedSurgery
    priority: 1
    steps:
    - SurgeryStepCloseBones
    - SurgeryStepMendRibcage
    - SurgeryStepCloseIncision
  - type: ShitmedSurgeryPartPresentCondition

- type: entity
  parent: ShitmedSurgeryBase
  id: ShitmedSurgeryOpenRibcage
  name: Open Ribcage
  categories: [ HideSpawnMenu ]
  components:
  - type: ShitmedSurgery
    requirement: ShitmedSurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepPriseOpenBones
  - type: ShitmedSurgeryPartCondition
    part: Torso

- type: entity
  parent: ShitmedSurgeryBase
  id: SurgeryRemovePart
  name: Remove Part
  categories: [ HideSpawnMenu ]
  components:
  - type: ShitmedSurgery
    requirement: ShitmedSurgeryOpenIncision
    steps:
    - SurgeryStepSawFeature
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRemoveFeature
  - type: ShitmedSurgeryHasBodyCondition
  - type: ShitmedSurgeryPartCondition
    part: Torso
    inverse: true

