# Cybernetic implants that grant abilities via subdermal implants
# These are body parts (not organs) that can exist at different tissue layers
# They use tag-based configuration: add Grants[SubdermalImplantId] tag to specify which implant to spawn

# Base prototype for ability-granting cybernetic implants
- type: entity
  id: BaseCyberneticAbilityImplant
  parent: BaseItem
  abstract: true
  components:
  - type: Cybernetics
  - type: BodyPart
    partType: Other
    size: Tiny
  - type: CyberneticIntegrity
    baseIntegrityCost: 0.5

# Examples of ability-granting cybernetic implants

- type: entity
  parent: BaseCyberneticAbilityImplant
  id: ScramImplantCybernetics
  name: scram cybernetic implant
  description: A cybernetic implant that grants scram teleport functionality.
  components:
  - type: Tag
    tags:
    - GrantsScramImplant

