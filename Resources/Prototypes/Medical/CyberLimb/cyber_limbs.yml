  id: BasicLeftArm
  name: basic cybernetic left arm
  description: A standard cybernetic left arm with improved storage capacity. Requires Tier 1 Civilian Services research.
  components:
  - type: BodyPart
    baseLayerId: MobCyberneticHesphiastosLArm
  - type: GenerateChildPart
    id: LeftHandCyberneticHesphiastos
