# ============================================
# MILITARY CYBER-LIMBS (Tier 2 Security Research, 3x3 storage + 10% damage resistance)
# ============================================

- type: entity
  parent: LeftArmCybernetic
  id: MilitaryLeftArm
  name: military cybernetic left arm
  description: A military-grade cybernetic left arm with reinforced plating providing 10% damage resistance. Requires Tier 2 Security Research.
  components:
  - type: BodyPart
    baseLayerId: MobCyberneticMorpheusLArm
  - type: GenerateChildPart
    id: LeftHandCyberneticMorpheus
  - type: Storage
    grid:
    - 0,0,3,3  # 3 rows x 3 columns = 9 slots
    maxItemSize: Small
  - type: CyberLimbStorage
  - type: CyberLimbInspectable
  - type: CyberLimbMaintenance
  - type: CyberLimbDamageResistance
    resistanceCoefficient: 0.9  # 10% damage reduction (multiplicative)

