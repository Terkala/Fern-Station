# Base cyber-limb prototypes with storage
# All cyber-limbs inherit from the abstract cybernetic prototypes in _Shitmed

# ============================================
# RUDIMENTARY CYBER-LIMBS (Roundstart, 2x3 storage)
# ============================================

- type: entity
  parent: LeftArmCybernetic
  id: RudimentaryLeftArm
  name: rudimentary cybernetic left arm
  description: A basic cybernetic left arm with limited storage capacity. Available at roundstart.
  components:
  - type: Storage
    grid:
    - 0,0,3,2  # 2 rows x 3 columns = 6 slots
    maxItemSize: Small
  - type: CyberLimbStorage
  - type: CyberLimbInspectable
  - type: CyberLimbMaintenance

- type: entity
  parent: RightArmCybernetic
  id: RudimentaryRightArm
  name: rudimentary cybernetic right arm
  description: A basic cybernetic right arm with limited storage capacity. Available at roundstart.
  components:
  - type: Storage
    grid:
    - 0,0,3,2  # 2 rows x 3 columns = 6 slots
    maxItemSize: Small
  - type: CyberLimbStorage
  - type: CyberLimbInspectable
  - type: CyberLimbMaintenance

- type: entity
  parent: LeftLegCybernetic
  id: RudimentaryLeftLeg
  name: rudimentary cybernetic left leg
  description: A basic cybernetic left leg with limited storage capacity. Available at roundstart.
  components:
  - type: Storage
    grid:
    - 0,0,2,2  # 2 rows x 2 columns = 4 slots
    maxItemSize: Small
  - type: CyberLimbStorage
  - type: CyberLimbInspectable
  - type: CyberLimbMaintenance

- type: entity
  parent: RightLegCybernetic
  id: RudimentaryRightLeg
  name: rudimentary cybernetic right leg
  description: A basic cybernetic right leg with limited storage capacity. Available at roundstart.
  components:
  - type: Storage
    grid:
    - 0,0,2,2  # 2 rows x 2 columns = 4 slots
    maxItemSize: Small
  - type: CyberLimbStorage
  - type: CyberLimbInspectable
  - type: CyberLimbMaintenance

