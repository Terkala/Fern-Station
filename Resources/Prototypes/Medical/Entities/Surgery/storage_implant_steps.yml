# Surgery steps for storage implant organ

# Access storage implant (find it in tissue layer)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepAccessStorageImplant
  name: Access Storage Implant
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
    duration: 2.0
    targetOrganSlot: storage_implant

# Remove storage implant organ
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveStorageImplant
  name: Remove Storage Implant
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Organ
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 3.0
    targetOrganSlot: storage_implant

