# Surgery procedures for cybernetics maintenance
# These procedures appear on the skin layer when cybernetics are present

# Cyber Heart Maintenance
- type: entity
  parent: SurgeryBase
  id: SurgeryCyberHeartMaintenance
  name: Cyber Heart Maintenance
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    priority: 10
    steps:
    - SurgeryStepOpenCyberneticsPanel
    - SurgeryStepAdjustCyberneticsBolts
    - SurgeryStepReplaceCyberneticsWiring
    - SurgeryStepCloseCyberneticsPanel

