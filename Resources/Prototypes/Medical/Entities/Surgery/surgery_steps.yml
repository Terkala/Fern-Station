# Surgery step prototypes for the new surgery system
# Each step defines duration, required tools, and effects
# Steps are organized by layer: Skin, Tissue, Organ

- type: entity
  id: SurgeryStepBase
  categories: [ HideSpawnMenu ]

# ===== SKIN LAYER STEPS =====

# Retract Skin Sequence - Step 1
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin1
  name: Retract Skin (Step 1/2)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Skin
    sequenceId: RetractSkinSequence
    sequenceIndex: 0
    isReversible: true
    operationId: RetractTissue
    duration: 2.0

# Retract Skin Sequence - Step 2
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin2
  name: Retract Skin (Step 2/2)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Skin
    sequenceId: RetractSkinSequence
    sequenceIndex: 1
    isReversible: true
    operationId: RetractTissue
    duration: 2.0
    applyPenalty: 1
    layerStateChanges:
      setSkinRetracted: true

# Close Skin Sequence - Step 1
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseSkin1
  name: Close Skin (Step 1/2)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Skin
    sequenceId: CloseSkinSequence
    sequenceIndex: 0
    isReversible: true
    operationId: ProperlyRetractTissue
    duration: 2.0

# Close Skin Sequence - Step 2
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseSkin2
  name: Close Skin (Step 2/2)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Skin
    sequenceId: CloseSkinSequence
    sequenceIndex: 1
    isReversible: true
    operationId: ProperlyRetractTissue
    duration: 2.0
    removePenaltyStepId: SurgeryStepRetractSkin2
    layerStateChanges:
      setSkinRetracted: false

# Treat brute wounds (skin level)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepTreatBruteWounds
  name: Treat Brute Wounds
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Skin
    tool:
      - type: Tending
    duration: 1.0
  - type: SurgeryTendWoundsEffect
    mainGroup: Brute
    damage:
      groups:
        Brute: -5
    healMultiplier: 0.07
  - type: SurgeryRepeatableStep

# Treat burn wounds (skin level)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepTreatBurnWounds
  name: Treat Burn Wounds
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Skin
    tool:
      - type: Tending
    duration: 1.0
  - type: SurgeryTendWoundsEffect
    mainGroup: Burn
    damage:
      groups:
        Burn: -5
    healMultiplier: 0.07
  - type: SurgeryRepeatableStep

# ===== TISSUE LAYER STEPS =====

# Retract Tissue Sequence - Step 1
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractTissue1
  name: Retract Tissue (Step 1/3)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    sequenceId: RetractTissueSequence
    sequenceIndex: 0
    isReversible: true
    operationId: RetractTissue
    requirements:
      requiresSkinRetracted: true
    duration: 2.5
    applyPenalty: 1
    layerStateChanges:
      setTissueRetracted: true
    triggersUnsanitaryPenalty: true

# Retract Tissue Sequence - Step 2 (Saw Bones)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBonesTorso
  name: Saw Through Bones (Torso)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    sequenceId: RetractTissueSequence
    sequenceIndex: 1
    isReversible: true
    operationId: BoneRemoval
    validPartTypes:
      - Torso
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
    duration: 4.0
    applyPenalty: 4
    layerStateChanges:
      setBonesSawed: true

# Retract Tissue Sequence - Step 3
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractTissue2
  name: Retract Tissue (Step 3/3)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    sequenceId: RetractTissueSequence
    sequenceIndex: 2
    isReversible: true
    operationId: RetractTissue
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 2.5

# Mend Tissue Sequence - Step 1
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendTissue1
  name: Mend Tissue (Step 1/3)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    sequenceId: MendTissueSequence
    sequenceIndex: 0
    isReversible: true
    operationId: ProperlyRetractTissue
    duration: 2.5

# Mend Tissue Sequence - Step 2 (Mend Bones)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendBones
  name: Mend Bones
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    sequenceId: MendTissueSequence
    sequenceIndex: 1
    isReversible: true
    operationId: MendBones
    duration: 3.0
    removePenaltyStepId: SurgeryStepSawBonesTorso
    layerStateChanges:
      setBonesSawed: false

# Mend Tissue Sequence - Step 3
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendTissue2
  name: Mend Tissue (Step 3/3)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    sequenceId: MendTissueSequence
    sequenceIndex: 2
    isReversible: true
    operationId: ProperlyRetractTissue
    duration: 2.5
    removePenaltyStepId: SurgeryStepRetractTissue1
    layerStateChanges:
      setTissueRetracted: false


# Saw through skull (head) - requires tissue retracted
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawSkull
  name: Cut Skull Opening
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    operationId: BoneRemoval
    validPartTypes:
      - Head
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
    duration: 4.0
    applyPenalty: 4
    layerStateChanges:
      setBonesSawed: true

# Treat unsanitary conditions - resets patient to current room cleanliness level
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepTreatUnsanitaryConditions
  name: Treat Unsanitary Conditions
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
    duration: 3.0

# Smash bones (torso) - crude surgery, requires tissue retracted
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSmashBonesTorso
  name: Smash Bones (Torso) [Crude]
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    operationId: BoneRemoval
    validPartTypes:
      - Torso
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
    duration: 4.0
    applyPenalty: 8
    layerStateChanges:
      setBonesSmashed: true

# ===== BONE REPAIR STEPS (For Smashed Bones) =====

# Stage 1: Align bone fragments
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBonesStage1
  name: Align Bone Fragments (Stage 1/5)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    duration: 3.0

# Stage 2: Set bone fragments
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBonesStage2
  name: Set Bone Fragments (Stage 2/5)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    duration: 3.5

# Stage 3: Stabilize fragments
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBonesStage3
  name: Stabilize Fragments (Stage 3/5)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    duration: 4.0

# Stage 4: Apply bone-gel
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBonesStage4
  name: Apply Bone-Gel (Stage 4/5)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    duration: 2.5

# Stage 5: Final bone repair
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBonesStage5
  name: Complete Bone Repair (Stage 5/5)
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    duration: 3.0
    removePenaltyStepId: SurgeryStepSmashBonesTorso
    layerStateChanges:
      setBonesSmashed: false

# ===== ORGAN LAYER STEPS =====

# Clamp blood vessels (requires bones sawed for torso/head)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampVessels
  name: Clamp Blood Vessels
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Organ
    operationId: ClampBloodVessels
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 2.5

# Sever blood vessels
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSeverVessels
  name: Sever Blood Vessels
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Organ
    operationId: SeverBloodVessels
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 3.0

# Remove organ (generic - dynamically named per organ)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveOrgan
  name: Remove Organ
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Organ
    operationId: RemoveOrgan
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 2.0

# Insert organ (generic - dynamically named per organ)
- type: entity
  parent: SurgeryStepBase
  id: NewSurgeryStepInsertOrgan
  name: Insert Organ
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Organ
    operationId: InsertOrgan
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 2.0

# Remove implant (generic - dynamically named per implant)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveImplant
  name: Remove Implant
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    operationId: RemoveOrgan
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
    duration: 2.0

# Add implant (generic - dynamically named per implant)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepAddImplant
  name: Add Implant
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Tissue
    operationId: InsertOrgan
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
    duration: 2.0

# Remove organ implant (generic - dynamically named per implant)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveOrganImplant
  name: Remove Organ Implant
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Organ
    operationId: RemoveOrgan
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 2.0

# Add organ implant (generic - dynamically named per implant)
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepAddOrganImplant
  name: Add Organ Implant
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryStep
    layer: Organ
    operationId: InsertOrgan
    requirements:
      requiresSkinRetracted: true
      requiresTissueRetracted: true
      requiresBonesSawed: true
    duration: 2.0
