# New simplified autodoc with 3 operation modes

- type: entity
  parent: [ConstructibleMachine, BaseMachinePowered]
  id: Autodoc
  name: Autodoc Mk.XV
  description: "A simplified robotic surgeon with three operation modes: organ implant, medical care, and organ removal."
  components:
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/autodoc.rsi
    layers:
    - state: idle
  - type: Hands
  - type: HandsFill
    hands:
      multitool: OmnimedToolAutodoc
      organ_slot: null
  - type: WiresPanel
  - type: Wires
    layoutId: Autodoc
    boardName: wires-board-name-autodoc
  - type: Machine
    board: AutodocCircuitboard
  - type: Construction
    graph: Machine
    node: machine
    containers:
     - machine_board
     - machine_parts
     - storagebase
  - type: EmptyOnMachineDeconstruct
    containers:
    - organ_slot
    - storagebase
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
        showEnts: False
        occludes: True
        ents: []
      machine_parts: !type:Container
        showEnts: False
        occludes: True
        ents: []
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      hidden_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      organ_slot:
        name: autodoc-organ-slot
        whitelist:
          tags:
          - Organ
      hidden_slot:
        name: computer_slot_accessory
        whitelist:
          tags:
          - ListeningBug
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSink
    ports:
    - OperatingTableReceiver
  - type: UserInterface
    interfaces:
      enum.AutodocUIKey.Key:
        type: AutodocBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.AutodocUIKey.Key
  - type: ActivatableUIRequiresPower
  - type: Autodoc
    organSlot: organ_slot
  - type: Sanitized # DeltaV
  - type: SurgerySelfDirty # DeltaV
  - type: DoAfter # Required for it to do surgery
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Storage
    clickInsert: false
    grid:
    - 0,0,3,3
  - type: GuideHelp
    guides: [ Autodoc ]


