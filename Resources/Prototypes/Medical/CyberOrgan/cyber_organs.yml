# ============================================
# RUDIMENTARY CYBER-ORGANS (Roundstart, 2x2 storage)
# ============================================

- type: entity
  parent: BaseCyberHeart
  id: RudimentaryCyberHeart
  name: rudimentary cybernetic heart
  description: A basic cybernetic heart with limited storage capacity.
  components:
  - type: Cybernetics
  - type: Sprite
    sprite: _EinsteinEngines/Mobs/Species/IPC/organs.rsi
    state: heart-on
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1  # 2x2 = 4 slots
  - type: Storage
    grid:
    - 0,0,2,2  # 2 rows x 2 columns = 4 slots
    maxItemSize: Small
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: CyberLimbStorage
  - type: CyberLimbInspectable
  - type: CyberLimbMaintenance
  - type: CyberneticIntegrity
    baseIntegrityCost: 1.0
  - type: CyberOrganEfficiency

