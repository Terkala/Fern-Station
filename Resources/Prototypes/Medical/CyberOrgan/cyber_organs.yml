# Base cyber-organ prototype with storage
# All cyber-organs inherit from the abstract cybernetic organ prototype

# Base cybernetic organ prototypes without Food component (cybernetic organs are metal and cannot be eaten)
# These bases replicate BaseHumanOrganUnGibbable/BaseHumanOrgan but without the Food component
- type: entity
  id: BaseCyberOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
  - type: Organ
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 8
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat
      - Organ

- type: entity
  id: BaseCyberOrganGibbable
  parent: BaseCyberOrgan
  abstract: true
  components:
  - type: Gibbable

# Base cybernetic organ prototypes for each organ type (without Food component)
- type: entity
  id: BaseCyberHeart
  parent: BaseCyberOrganGibbable
  abstract: true
  components:
  - type: Heart
  - type: Organ
    slotId: heart
  - type: Sprite
    state: heart-on
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [Human]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
  - type: Tag
    tags:
      - Meat
      - Organ
      - Heart
  - type: OrganIntegrity
    baseIntegrityCost: 1.5
  - type: OrganCompatibility
    compatibleSpecies:
      - Human
      - Dwarf
    incompatibleCostMultiplier: 2.0

- type: entity
  id: BaseCyberLungs
  parent: BaseCyberOrganGibbable
  abstract: true
  components:
  - type: Organ
    slotId: lungs
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Human ]
    groups:
    - id: Gas
      rateModifier: 100.0

- type: entity
  id: BaseCyberStomach
  parent: BaseCyberOrganGibbable
  abstract: true
  components:
  - type: Organ
    slotId: stomach
  - type: Sprite
    state: stomach
  - type: Stomach
  - type: Metabolizer
    maxReagents: 20
    metabolizerTypes: [ Human ]
    groups:
    - id: Food
      rateModifier: 1.0
  - type: Tag
    tags:
      - Meat
      - Organ
      - Stomach
  - type: OrganIntegrity
    baseIntegrityCost: 1.0
  - type: OrganCompatibility
    compatibleSpecies:
      - Human
      - Dwarf
    incompatibleCostMultiplier: 2.0

- type: entity
  id: BaseCyberLiver
  parent: BaseCyberOrganGibbable
  abstract: true
  components:
  - type: Organ
    slotId: liver
  - type: Sprite
    state: liver
  - type: Liver
  - type: Metabolizer
    maxReagents: 10
    metabolizerTypes: [ Human ]
    groups:
    - id: Toxin
      rateModifier: 1.0
  - type: Tag
    tags:
      - Meat
      - Organ
      - Liver
  - type: OrganIntegrity
    baseIntegrityCost: 1.0
  - type: OrganCompatibility
    compatibleSpecies:
      - Human
      - Dwarf
    incompatibleCostMultiplier: 2.0

