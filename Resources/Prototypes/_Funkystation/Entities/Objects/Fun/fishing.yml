- type: entity
  parent: BaseItem
  id: FishingRod
  name: fishing rod
  description: A simple rod for angling in whatever passes for a pond on a space station.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/mop.rsi
    state: mop
    scale: 0.85, 0.85
  - type: Item
    sprite: Objects/Specific/Janitorial/mop.rsi
    size: Normal
  - type: FishingRod

- type: entity
  id: FishingPuddleSilhouette
  name: fishing silhouette
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: HighFloorObjects
    sprite: Fluids/puddle.rsi
    state: splat0
    color: "#FFFFFF01"
  - type: PuddleFishingSilhouette

# Loot + underwater silhouette preview use the same table (maintenance-style picks + a few staples).
- type: entityTable
  id: FishingLootTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MaintToolsTable
      weight: 38
    - !type:NestedSelector
      tableId: MaintFluffTable
      weight: 38
    - !type:NestedSelector
      tableId: MaintWeaponTable
      weight: 8
    - !type:GroupSelector
      weight: 16
      children:
      - id: FoodApple
      - id: FoodBanana
      - id: DrinkWaterCup
      - id: TrashBananaPeel
        weight: 0.5
      - id: ToyRubberDuck
        weight: 0.3
      - id: MobCarp
        weight: 0.12
